
name: Liderakademi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v5

      - name: Node kur
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Java kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: ZIP dosyasini ac
        run: |
          mkdir -p proje
          unzip -o liderakademi-android-proje.zip -d proje

      - name: Proje klasorunu bul
        run: |
          FILE=$(find proje -name package.json -not -path '*/node_modules/*' -print -quit)
          if [ -z "$FILE" ]; then
            echo "HATA: package.json bulunamadi"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Proje bulundu: $DIR"

      - name: Paketleri yukle
        run: npm install
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Web uygulamasini derle
        run: npm run build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Capacitor ayarla
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.js ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.liderakademi.app",
            "appName": "Liderakademi",
            "webDir": "dist"
          }
          EOF
          fi
          if [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Android APK derle
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Liderakademi-APK
          path: proje/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
